services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: evedentia
      POSTGRES_PASSWORD: evedentia
      POSTGRES_DB: evedentia
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evedentia"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]
  ollama:
    image: ollama/ollama
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
  backend:
    build: ./backend
    env_file: .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pgdata:
  ollama:
